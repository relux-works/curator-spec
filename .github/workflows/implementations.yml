name: Implementation conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Implementations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance/v1
    steps:
      - name: Checkout specification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Go manager
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: relux-works/curator
          # Curator 0a628621 classifies executable_identity_cases and the
          # hard_link_substitution_definition added by PR #88. Keep this pin
          # in lockstep with that suite erratum and its production consumer.
          ref: 0a62862130fd6cbd9db8b246da63fdb5aecdfaaf
          path: implementations/go
          submodules: true
          # The Go suite does not use the board state. Excluding its deep paths
          # avoids Windows checkout path-length failures while retaining all
          # implementation sources and declared submodules.
          sparse-checkout: |
            /*
            !/.task-board/
          sparse-checkout-cone-mode: false

      - name: Checkout Python manager
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ivanopcode/cocoaskills
          # cocoaskills 4a88aa0e is pinned to the accepted skillfile-sources-v1
          # corpus. Its declared scope is core v1.0.0-rc.10 plus that draft
          # corpus and schemas from this candidate; it does not claim rc.11-rc.12.
          ref: 4a88aa0e47ab2b34ded16162cec7f97d0c7cf6f1
          path: implementations/manager

      - name: Checkout Python manager core v1.0.0-rc.10
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: relux-works/curator-spec
          # The Python client declares support through rc.10. Keep its core
          # checks on that released corpus while Go checks the full candidate.
          ref: v1.0.0-rc.10
          path: implementations/manager-core

      - name: Checkout registry service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: relux-works/curator-skill-registry
          ref: d690bea6fab1c8e6392e05d3a3cdfcf1168bc914
          path: implementations/registry

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: implementations/go/go.mod
          cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python implementations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./implementations/manager[dev]" -e "./implementations/registry[dev]"

      # Each client's declared artefacts are checked against its own core
      # root: curator gets the full candidate, cocoaskills gets released rc.10.
      - name: Require curator's candidate core artefacts
        run: >-
          python tools/implementation_coverage.py families
          --implementation go --root conformance/v1

      - name: Require cocoaskills rc.10 core artefacts
        run: >-
          python tools/implementation_coverage.py families
          --implementation manager
          --root implementations/manager-core/conformance/v1

      # The stream is captured rather than piped so the gate below reads the
      # run it is gating, and this step still reports `go test`'s own status.
      - name: Go manager shared suite
        shell: bash
        working-directory: implementations/go
        run: |
          set +e
          go test -count=1 -json \
            ./internal/interop ./internal/closure ./internal/skillspec \
            ./internal/marker ./internal/moduleroots ./internal/scriptpolicy \
            > go-test.json
          status=$?
          set -e
          cat go-test.json
          exit "$status"

      # The consumption half. A rename, a deletion, a package dropped from the
      # invocation above or a skip fails here BY NAME rather than shrinking the
      # run behind a green `go test`.
      - name: Gate the declared Go consumption cases
        run: >-
          python tools/implementation_coverage.py go
          --stream implementations/go/go-test.json

      # The Python manager's own presence ledger is also checked against its
      # declared rc.10 core corpus, not the newer candidate core.
      - name: Require the Python manager's rc.10 core artefacts
        run: >-
          python implementations/manager/.github/scripts/candidate_consumption.py
          require --root implementations/manager-core/conformance/v1

      - name: Python manager rc.10 schema-8 consumption
        working-directory: implementations/manager
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/implementations/manager-core/conformance/v1
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --junitxml=manager-schema8-results.xml

      - name: Gate the declared Python manager consumption cases
        run: >-
          python tools/implementation_coverage.py pytest
          --results implementations/manager/manager-schema8-results.xml

      # The draft test reads CSK_DRAFT_SOURCES_SUITE_ROOT and resolves
      # schemas/v1 plus schemas/skillfile-sources-v1 from the candidate checkout
      # two levels above that suite path. This feeds both corpus and schemas
      # from this candidate. cocoaskills declares this POSIX-only draft lane;
      # its own workflow excludes Windows for this suite.
      - name: Python manager candidate skillfile-sources-v1 consumption
        if: runner.os != 'Windows'
        working-directory: implementations/manager
        env:
          CSK_DRAFT_SOURCES_SUITE_ROOT: ${{ github.workspace }}/conformance/skillfile-sources-v1
        run: >-
          python -m pytest -q tests/test_draft_sources_conformance.py
          --junitxml=manager-skillfile-sources-results.xml

      # NOTE ON THE PYTHON MANAGER'S RELEASED-SUITE MODULE.
      # `tests/test_protocol_conformance.py` authenticates its own immutable
      # rc.6 suite and rejects arbitrary roots. It is not the cross-implementation
      # qualification here: the schema-8 cases above use the manager's declared
      # rc.10 core, and the draft-source cases use the candidate corpus and schemas.
      - name: Python manager lifecycle behavior
        run: >-
          python -m pytest -q
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_keeps_existing_config
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_creates_absent_config
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_and_force_are_mutually_exclusive
          implementations/manager/tests/test_cli.py::test_cli_upgrade_dry_run_does_not_create_or_fetch_skills_root
          implementations/manager/tests/test_cli.py::test_cli_upgrade_fetches_only_selected_project_skill_repositories
          implementations/manager/tests/test_closure_install.py::test_upgrade_fetches_transitive_dependency_closure
          implementations/manager/tests/test_global_install.py::test_global_upgrade_dry_run_does_not_create_or_fetch_skills_root
          implementations/manager/tests/test_install.py::test_runtime_shim_resolves_project_skill_command_dependency_without_shell_hook
          implementations/manager/tests/test_install.py::test_runtime_shim_captures_declared_system_dependency_path
          implementations/manager/tests/test_shims.py::test_unix_wrapper_prepends_runtime_path_entries
          implementations/manager/tests/test_shims.py::test_windows_wrapper_prepends_runtime_path_entries

      - name: Registry service shared suite
        run: >-
          python tools/run_pytest_no_skips.py -q
          implementations/registry/tests/test_protocol_conformance.py
