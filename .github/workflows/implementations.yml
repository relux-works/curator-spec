name: Implementation conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Implementations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance/v1
    steps:
      - name: Checkout specification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Go manager
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: relux-works/curator
          # relux-works/curator main at PR 37, the commit that stopped treating
          # a family's presence in the conformance root as evidence that
          # anything read it. It declares the schema-8 artefacts its packages
          # consume and adds `internal/scriptpolicy`; qualified against this
          # suite by candidate dispatch 32689488293.
          ref: a3abcf3468b4854904313295672eef6f7d8826fd
          path: implementations/go
          submodules: true

      - name: Checkout Python manager
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ivanopcode/cocoaskills
          # ivanopcode/cocoaskills main at PR 43, the mirror of curator PR 37
          # on the Python side. Its schema-8 consumer is root-derived, so it
          # decides real behaviour against whatever suite this job publishes;
          # qualified against this suite by candidate run 32756144649.
          ref: 3ecca1dba9f8831e1617b7466c17ecc8a2957d3f
          path: implementations/manager

      - name: Checkout registry service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: relux-works/curator-skill-registry
          ref: d690bea6fab1c8e6392e05d3a3cdfcf1168bc914
          path: implementations/registry

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: implementations/go/go.mod
          cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python implementations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./implementations/manager[dev]" -e "./implementations/registry[dev]"

      # The presence half of the coverage contract. Every artefact
      # `.github/ci/implementation-coverage.tsv` claims a pinned implementation
      # reads must still be published by this suite, so a family cannot be
      # deleted while the ledger keeps claiming it is consumed.
      - name: Require this suite to publish every declared artefact
        run: python tools/implementation_coverage.py families --root conformance/v1

      # The stream is captured rather than piped so the gate below reads the
      # run it is gating, and this step still reports `go test`'s own status.
      - name: Go manager shared suite
        shell: bash
        working-directory: implementations/go
        run: |
          set +e
          go test -count=1 -json \
            ./internal/interop ./internal/closure ./internal/skillspec \
            ./internal/marker ./internal/moduleroots ./internal/scriptpolicy \
            > go-test.json
          status=$?
          set -e
          cat go-test.json
          exit "$status"

      # The consumption half. A rename, a deletion, a package dropped from the
      # invocation above or a skip fails here BY NAME rather than shrinking the
      # run behind a green `go test`.
      - name: Gate the declared Go consumption cases
        run: >-
          python tools/implementation_coverage.py go
          --stream implementations/go/go-test.json

      # The Python manager's own presence ledger, run against this suite. It
      # fails when this root serves the schema-8 consumer only partly, so a
      # half-published surface cannot run quieter instead of failing.
      - name: Require the Python manager's declared artefacts
        run: >-
          python implementations/manager/.github/scripts/candidate_consumption.py
          require --root conformance/v1

      - name: Python manager schema-8 consumption
        working-directory: implementations/manager
        env:
          CSK_REQUIRE_FULL_CANDIDATE_ROOT: "1"
        run: >-
          python -m pytest -q tests/test_schema8_candidate_conformance.py
          --junitxml=manager-schema8-results.xml

      - name: Gate the declared Python manager consumption cases
        run: >-
          python tools/implementation_coverage.py pytest
          --results implementations/manager/manager-schema8-results.xml

      # NOTE ON THE PYTHON MANAGER'S RELEASED-SUITE MODULE.
      # `tests/test_protocol_conformance.py` used to run here against this
      # repository's own root. At this pin it authenticates ONE immutable
      # suite -- protocol `1.0.0-rc.6`, manifest `sha256:12e58b82...` -- and
      # refuses every other root by design; it could be pointed at this
      # repository's moving root only while the previous pin performed no
      # authentication at all, which is the same false-green the schema-8
      # coverage contract above exists to remove. That module keeps running
      # against the suite it names in that implementation's own CI, and it
      # returns to this job when its released suite pin advances to rc.9 --
      # the step the landing order schedules after rc.9 is published. Until
      # then the schema-8 consumption steps above, plus the root-independent
      # lifecycle selection below, are what this job asserts about that pin.
      - name: Python manager lifecycle behavior
        run: >-
          python -m pytest -q
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_keeps_existing_config
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_creates_absent_config
          implementations/manager/tests/test_cli.py::test_cli_bootstrap_if_missing_and_force_are_mutually_exclusive
          implementations/manager/tests/test_cli.py::test_cli_upgrade_dry_run_does_not_create_or_fetch_skills_root
          implementations/manager/tests/test_cli.py::test_cli_upgrade_fetches_only_selected_project_skill_repositories
          implementations/manager/tests/test_closure_install.py::test_upgrade_fetches_transitive_dependency_closure
          implementations/manager/tests/test_global_install.py::test_global_upgrade_dry_run_does_not_create_or_fetch_skills_root
          implementations/manager/tests/test_install.py::test_runtime_shim_resolves_project_skill_command_dependency_without_shell_hook
          implementations/manager/tests/test_install.py::test_runtime_shim_captures_declared_system_dependency_path
          implementations/manager/tests/test_shims.py::test_unix_wrapper_prepends_runtime_path_entries
          implementations/manager/tests/test_shims.py::test_windows_wrapper_prepends_runtime_path_entries

      - name: Registry service shared suite
        run: >-
          python tools/run_pytest_no_skips.py -q
          implementations/registry/tests/test_protocol_conformance.py
